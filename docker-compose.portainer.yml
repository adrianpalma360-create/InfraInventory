# ============================================================
# InfraInventory - Portainer & Production Stack Compose
# ============================================================
# Despliegue directo desde Portainer (Stacks -> Git Repository)
# o mediante Docker Compose CLI en servidores de producción.
# ============================================================

services:
  # 🐘 Base de datos PostgreSQL Relacional (Aislada internamente en la red Docker)
  postgres:
    image: postgres:16-alpine
    container_name: infrainventory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infrainventory_db}
      POSTGRES_USER: ${POSTGRES_USER:-infrainventory_user}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured}"
    volumes:
      - infrainventory_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-infrainventory_user} -d ${POSTGRES_DB:-infrainventory_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - infrainventory_network

  # 🔍 Microservicio de Descubrimiento de Red y Sondeo de Puertos
  discovery:
    image: ghcr.io/${GHCR_NAMESPACE:-adrianpalma360-create}/infrainventory-discovery:${IMAGE_TAG:-${APP_VERSION:-latest}}
    pull_policy: always
    container_name: infrainventory-discovery
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
    cap_add:
      - NET_RAW
    labels:
      org.opencontainers.image.version: "${IMAGE_TAG:-${APP_VERSION:-latest}}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - infrainventory_network

  # ⚙️ API Backend (Fastify + Prisma ORM + WebSockets + Automatizaciones)
  backend:
    image: ghcr.io/${GHCR_NAMESPACE:-adrianpalma360-create}/infrainventory-backend:${IMAGE_TAG:-${APP_VERSION:-latest}}
    pull_policy: always
    container_name: infrainventory-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "postgresql://${POSTGRES_USER:-infrainventory_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured}@postgres:5432/${POSTGRES_DB:-infrainventory_db}?schema=public"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be configured}"
      COOKIE_SECRET: "${COOKIE_SECRET:?COOKIE_SECRET must be configured}"
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      DISCOVERY_SERVICE_URL: http://discovery:5000
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_BASE_URL: ${AI_BASE_URL:-http://ollama:11434}
      AI_MODEL: ${AI_MODEL:-llama3:8b}
      AI_API_KEY: ${AI_API_KEY:-}
    labels:
      org.opencontainers.image.version: "${IMAGE_TAG:-${APP_VERSION:-latest}}"
    depends_on:
      postgres:
        condition: service_healthy
      discovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - infrainventory_network

  # 📡 Worker de Monitorización Continua & Telemetría en Tiempo Real
  monitoring-worker:
    image: ghcr.io/${GHCR_NAMESPACE:-adrianpalma360-create}/infrainventory-monitoring-worker:${IMAGE_TAG:-${APP_VERSION:-latest}}
    pull_policy: always
    container_name: infrainventory-monitoring-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5050
      BACKEND_URL: http://backend:4000
    labels:
      org.opencontainers.image.version: "${IMAGE_TAG:-${APP_VERSION:-latest}}"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5050/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - infrainventory_network

  # 🌐 Frontend Web (React Dark NOC SPA servida por Nginx con Reverse Proxy a /api)
  frontend:
    image: ghcr.io/${GHCR_NAMESPACE:-adrianpalma360-create}/infrainventory-frontend:${IMAGE_TAG:-${APP_VERSION:-latest}}
    pull_policy: always
    container_name: infrainventory-frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-3000}:80"
    labels:
      org.opencontainers.image.version: "${IMAGE_TAG:-${APP_VERSION:-latest}}"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - infrainventory_network

volumes:
  infrainventory_postgres_data:
    name: infrainventory_postgres_data

networks:
  infrainventory_network:
    name: infrainventory_network
    driver: bridge
